name: Update streak pet

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # run manually from the Actions tab
  push:
    paths: ["pet/generate.py"]

permissions:
  contents: write

jobs:
  pet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate pet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python pet/generate.py
      - name: Commit if changed
        run: |
          git config user.name "streak-pet[bot]"
          git config user.email "streak-pet@users.noreply.github.com"
          git add pet/chicken.svg
          git diff --staged --quiet || git commit -m "chore: update streak pet" && git push